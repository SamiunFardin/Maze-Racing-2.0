<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Maze Racer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col justify-center items-center overflow-hidden">

    <!-- Auth / Main Menu Screen -->
    <div id="menu-screen" class="flex flex-col items-center space-y-6 p-8 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-96">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">TURBO MAZE RACER</h1>
        
        <div class="w-full flex flex-col space-y-3">
            <input type="text" id="username-input" placeholder="Username" class="p-3 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <input type="password" id="password-input" placeholder="Password" class="p-3 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <div class="flex items-center justify-between bg-slate-700 p-3 rounded-lg">
                <span class="text-sm text-slate-300">Car Color:</span>
                <input type="color" id="car-color-picker" value="#3b82f6" class="w-10 h-10 rounded cursor-pointer bg-transparent">
            </div>
            <button onclick="handleLogin()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 font-bold rounded-lg transition shadow-lg">START ENGINE</button>
        </div>
    </div>

    <!-- Game HUD & Canvas Viewport -->
    <div id="game-container" class="hidden relative flex flex-col items-center">
        <div id="hud" class="absolute top-4 left-4 z-10 flex space-x-4 bg-slate-800/80 px-4 py-2 rounded-lg backdrop-blur border border-slate-700">
            <span>Coins: <strong id="hud-coins" class="text-yellow-400">50</strong></span>
            <span>Speed: <strong id="hud-speed" class="text-cyan-400">0.0</strong></span>
        </div>
        <canvas id="gameCanvas" width="800" height="600" class="border-4 border-slate-700 rounded-lg shadow-2xl bg-slate-950"></canvas>
        
        <!-- Touch Controls for Mobile -->
        <div class="absolute bottom-6 flex justify-between w-full px-8 pointer-events-none">
            <div class="flex space-x-3 pointer-events-auto">
                <button id="btn-left" class="w-16 h-16 bg-slate-800/80 border border-slate-600 rounded-full text-xl font-bold active:bg-cyan-500">◀</button>
                <button id="btn-right" class="w-16 h-16 bg-slate-800/80 border border-slate-600 rounded-full text-xl font-bold active:bg-cyan-500">▶</button>
            </div>
            <div class="flex space-x-3 pointer-events-auto">
                <button id="btn-brake" class="w-16 h-16 bg-red-600/80 border border-red-500 rounded-full text-sm font-bold active:bg-red-700">BRAKE</button>
                <button id="btn-gas" class="w-16 h-16 bg-cyan-500/80 border border-cyan-400 rounded-full text-sm font-bold active:bg-cyan-600">GAS</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
